<svg xmlns="http://www.w3.org/2000/svg" width="680" height="640" viewBox="0 0 680 640" role="img">
<title>Entity resolution pipeline architecture</title>
<desc>Official data flows through normalisation, blocking, a LightGBM matching model and a threshold decision; blocking emits candidate_pairs.tsv, the decision emits matching_results.tsv, and both are validated and zipped.</desc>
<style>
.t{font:500 14px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#2C2C2A}
.s{font:400 12px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#5F5E5A}
.n rect{fill:#F1EFE8;stroke:#888780;stroke-width:.5}
.p rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}.p .t{fill:#3C3489}.p .s{fill:#534AB7}
.g rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}.g .t{fill:#085041}.g .s{fill:#0F6E56}
.a{stroke:#888780;stroke-width:1.5;fill:none}
@media (prefers-color-scheme:dark){.t{fill:#F1EFE8}.s{fill:#B4B2A9}.n rect{fill:#2C2C2A;stroke:#888780}
.p rect{fill:#3C3489;stroke:#AFA9EC}.p .t{fill:#EEEDFE}.p .s{fill:#CECBF6}
.g rect{fill:#085041;stroke:#5DCAA5}.g .t{fill:#E1F5EE}.g .s{fill:#9FE1CB}}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="n"><rect x="80" y="40" width="300" height="56" rx="8"/><text class="t" x="230" y="62" text-anchor="middle">Official data</text><text class="s" x="230" y="82" text-anchor="middle">7 TSV files, about 22M rows</text></g>
<g class="p"><rect x="80" y="136" width="300" height="56" rx="8"/><text class="t" x="230" y="158" text-anchor="middle">Clean and normalise</text><text class="s" x="230" y="178" text-anchor="middle">Romanise Hindi, fix abbreviations</text></g>
<g class="p"><rect x="80" y="232" width="300" height="56" rx="8"/><text class="t" x="230" y="254" text-anchor="middle">Shortlist (blocking)</text><text class="s" x="230" y="274" text-anchor="middle">About 12 look-alikes each</text></g>
<g class="g"><rect x="80" y="328" width="300" height="56" rx="8"/><text class="t" x="230" y="350" text-anchor="middle">Matching model</text><text class="s" x="230" y="370" text-anchor="middle">LightGBM on 43 pair features</text></g>
<g class="g"><rect x="80" y="424" width="300" height="56" rx="8"/><text class="t" x="230" y="446" text-anchor="middle">Match decision</text><text class="s" x="230" y="466" text-anchor="middle">Threshold tuned for F0.5</text></g>
<g class="n"><rect x="430" y="232" width="190" height="56" rx="8"/><text class="t" x="525" y="254" text-anchor="middle">candidate_pairs.tsv</text><text class="s" x="525" y="274" text-anchor="middle">Shortlist file</text></g>
<g class="n"><rect x="430" y="424" width="190" height="56" rx="8"/><text class="t" x="525" y="446" text-anchor="middle">matching_results.tsv</text><text class="s" x="525" y="466" text-anchor="middle">Leaderboard file</text></g>
<g class="n"><rect x="80" y="520" width="560" height="56" rx="8"/><text class="t" x="360" y="542" text-anchor="middle">Validate, document and zip</text><text class="s" x="360" y="562" text-anchor="middle">Official checker must say PASS</text></g>
<line class="a" x1="230" y1="96" x2="230" y2="134" marker-end="url(#ar)"/>
<line class="a" x1="230" y1="192" x2="230" y2="230" marker-end="url(#ar)"/>
<line class="a" x1="230" y1="288" x2="230" y2="326" marker-end="url(#ar)"/>
<line class="a" x1="230" y1="384" x2="230" y2="422" marker-end="url(#ar)"/>
<line class="a" x1="230" y1="480" x2="230" y2="518" marker-end="url(#ar)"/>
<line class="a" x1="380" y1="260" x2="428" y2="260" marker-end="url(#ar)"/>
<line class="a" x1="380" y1="452" x2="428" y2="452" marker-end="url(#ar)"/>
<line class="a" x1="525" y1="480" x2="525" y2="518" marker-end="url(#ar)"/>
<path class="a" d="M620 260 L632 260 L632 518" marker-end="url(#ar)"/>
<g class="p"><rect x="80" y="598" width="12" height="12" rx="2"/></g><text class="s" x="98" y="608">Preparation and shortlist</text>
<g class="g"><rect x="300" y="598" width="12" height="12" rx="2"/></g><text class="s" x="318" y="608">Machine learning</text>
<g class="n"><rect x="460" y="598" width="12" height="12" rx="2"/></g><text class="s" x="478" y="608">Data and output files</text>
</svg>
