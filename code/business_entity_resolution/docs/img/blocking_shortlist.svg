<svg xmlns="http://www.w3.org/2000/svg" width="680" height="216" viewBox="0 0 680 216" role="img">
<title>How the shortlist (blocking) is built</title>
<desc>Records emit keys, common keys are dropped by a bounded index, targets sharing rare keys are voted and reranked, and an adaptive cut keeps about 12 candidates which are exactly what the model scores.</desc>
<style>
.t{font:500 14px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#2C2C2A}
.s{font:400 12px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#5F5E5A}
.p rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}.p .t{fill:#3C3489}.p .s{fill:#534AB7}
.g rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}.g .t{fill:#085041}.g .s{fill:#0F6E56}
.a{stroke:#888780;stroke-width:1.5;fill:none}
@media (prefers-color-scheme:dark){.t{fill:#F1EFE8}.s{fill:#B4B2A9}
.p rect{fill:#3C3489;stroke:#AFA9EC}.p .t{fill:#EEEDFE}.p .s{fill:#CECBF6}
.g rect{fill:#085041;stroke:#5DCAA5}.g .t{fill:#E1F5EE}.g .s{fill:#9FE1CB}}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="p"><rect x="40" y="40" width="135" height="56" rx="8"/><text class="t" x="107" y="62" text-anchor="middle">Make keys</text><text class="s" x="107" y="82" text-anchor="middle">Name + address</text></g>
<g class="p"><rect x="195" y="40" width="135" height="56" rx="8"/><text class="t" x="262" y="62" text-anchor="middle">Bounded index</text><text class="s" x="262" y="82" text-anchor="middle">Rare keys only</text></g>
<g class="p"><rect x="350" y="40" width="135" height="56" rx="8"/><text class="t" x="417" y="62" text-anchor="middle">Vote and rerank</text><text class="s" x="417" y="82" text-anchor="middle">Top 60 by score</text></g>
<g class="p"><rect x="505" y="40" width="135" height="56" rx="8"/><text class="t" x="572" y="62" text-anchor="middle">Adaptive cut</text><text class="s" x="572" y="82" text-anchor="middle">Keep about 12</text></g>
<line class="a" x1="175" y1="68" x2="193" y2="68" marker-end="url(#ar)"/>
<line class="a" x1="330" y1="68" x2="348" y2="68" marker-end="url(#ar)"/>
<line class="a" x1="485" y1="68" x2="503" y2="68" marker-end="url(#ar)"/>
<g class="g"><rect x="350" y="136" width="290" height="56" rx="8"/><text class="t" x="495" y="158" text-anchor="middle">Matching model scores these</text><text class="s" x="495" y="178" text-anchor="middle">Same list saved as candidate_pairs.tsv</text></g>
<line class="a" x1="572" y1="96" x2="572" y2="134" marker-end="url(#ar)"/>
</svg>
