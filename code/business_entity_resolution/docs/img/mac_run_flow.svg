<svg xmlns="http://www.w3.org/2000/svg" width="680" height="640" viewBox="0 0 680 640" role="img">
<title>What happens when bash run.sh is started on the Mac</title>
<desc>Automatic steps setup, smoke test, baseline, experiment sweep and compare run in sequence; the baseline produces a first submission, compare produces the best submission, and the team leader uploads it.</desc>
<style>
.t{font:500 14px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#2C2C2A}
.s{font:400 12px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#5F5E5A}
.n rect{fill:#F1EFE8;stroke:#888780;stroke-width:.5}
.g rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}.g .t{fill:#085041}.g .s{fill:#0F6E56}
.c rect{fill:#FAECE7;stroke:#993C1D;stroke-width:.5}.c .t{fill:#712B13}.c .s{fill:#993C1D}
.a{stroke:#888780;stroke-width:1.5;fill:none}
@media (prefers-color-scheme:dark){.t{fill:#F1EFE8}.s{fill:#B4B2A9}.n rect{fill:#2C2C2A;stroke:#888780}
.g rect{fill:#085041;stroke:#5DCAA5}.g .t{fill:#E1F5EE}.g .s{fill:#9FE1CB}
.c rect{fill:#712B13;stroke:#F0997B}.c .t{fill:#FAECE7}.c .s{fill:#F5C4B3}}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="n"><rect x="60" y="40" width="260" height="56" rx="8"/><text class="t" x="190" y="62" text-anchor="middle">Setup</text><text class="s" x="190" y="82" text-anchor="middle">Private Python, 2-5 min</text></g>
<g class="n"><rect x="60" y="136" width="260" height="56" rx="8"/><text class="t" x="190" y="158" text-anchor="middle">Smoke test</text><text class="s" x="190" y="178" text-anchor="middle">Small sample, 3-5 min</text></g>
<g class="n"><rect x="60" y="232" width="260" height="56" rx="8"/><text class="t" x="190" y="254" text-anchor="middle">Baseline run</text><text class="s" x="190" y="274" text-anchor="middle">Full data, about 2 hours</text></g>
<g class="n"><rect x="60" y="328" width="260" height="56" rx="8"/><text class="t" x="190" y="350" text-anchor="middle">Experiment sweep</text><text class="s" x="190" y="370" text-anchor="middle">11 variations, each scored</text></g>
<g class="n"><rect x="60" y="424" width="260" height="56" rx="8"/><text class="t" x="190" y="446" text-anchor="middle">Compare and pick best</text><text class="s" x="190" y="466" text-anchor="middle">Holdout score, fewer candidates</text></g>
<g class="g"><rect x="380" y="232" width="240" height="56" rx="8"/><text class="t" x="500" y="254" text-anchor="middle">First submission ready</text><text class="s" x="500" y="274" text-anchor="middle">Upload early to leaderboard</text></g>
<g class="g"><rect x="380" y="424" width="240" height="56" rx="8"/><text class="t" x="500" y="446" text-anchor="middle">Best submission ready</text><text class="s" x="500" y="466" text-anchor="middle">Re-checked, zipped in final/</text></g>
<g class="c"><rect x="380" y="520" width="240" height="56" rx="8"/><text class="t" x="500" y="542" text-anchor="middle">Team leader uploads</text><text class="s" x="500" y="562" text-anchor="middle">Leaderboard file + final zip</text></g>
<line class="a" x1="190" y1="96" x2="190" y2="134" marker-end="url(#ar)"/>
<line class="a" x1="190" y1="192" x2="190" y2="230" marker-end="url(#ar)"/>
<line class="a" x1="190" y1="288" x2="190" y2="326" marker-end="url(#ar)"/>
<line class="a" x1="190" y1="384" x2="190" y2="422" marker-end="url(#ar)"/>
<line class="a" x1="320" y1="260" x2="378" y2="260" marker-end="url(#ar)"/>
<line class="a" x1="320" y1="452" x2="378" y2="452" marker-end="url(#ar)"/>
<line class="a" x1="500" y1="480" x2="500" y2="518" marker-end="url(#ar)"/>
<g class="n"><rect x="60" y="598" width="12" height="12" rx="2"/></g><text class="s" x="78" y="608">Automatic step</text>
<g class="g"><rect x="220" y="598" width="12" height="12" rx="2"/></g><text class="s" x="238" y="608">Files ready</text>
<g class="c"><rect x="360" y="598" width="12" height="12" rx="2"/></g><text class="s" x="378" y="608">Needs a person</text>
</svg>
